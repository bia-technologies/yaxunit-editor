<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAxUnit Editor</title>
  </head>
  <body>
    <div id="container" class="column"></div>
    <div id="output-panel" class="column">
      <div class="tabs">
        <button class="tab-button active" data-tab="code-model">Модель кода</button>
        <button class="tab-button" data-tab="parse-tree">Parse Tree</button>
        <button class="tab-button" data-tab="tokens">Tokens</button>
        <button class="tab-button" data-tab="errors">Ошибки лексера</button>
      </div>
      <div class="tab-content">
        <div id="tab-code-model" class="tab-pane active">
          <div id="model-tree" class="model-tree"></div>
        </div>
        <div id="tab-parse-tree" class="tab-pane">
          <div id="parse-tree" class="model-tree"></div>
        </div>
        <div id="tab-tokens" class="tab-pane">
          <div id="tokens" class="model-tree"></div>
        </div>
        <div id="tab-errors" class="tab-pane">
          <div id="errors" class="model-tree"></div>
        </div>
      </div>
    </div>
    <button id='V8WebAppEventRequestForwarder' style="display: none"></button>
    <button id='V8WebAppEventResponseForwarder' style="display: none"></button>

    <script type="module" src="playground/main.ts"></script>
  </body>
</html>
